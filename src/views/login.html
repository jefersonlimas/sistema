<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="/public/css/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--cor-fundo) 0%, var(--cor-primaria-light) 100%);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            max-width: 150px;
            max-height: 80px;
            margin-bottom: 20px;
        }

        .login-header h1 {
            color: var(--cor-primaria);
            margin: 0;
            font-size: 24px;
        }

        .login-header p {
            color: #666;
            margin: 10px 0 0 0;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--cor-primaria);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--cor-primaria);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-login:hover {
            background-color: var(--cor-primaria-dark);
        }

        .error-message {
            background-color: #ffe6e6;
            color: #d32f2f;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .setup-info {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        .setup-info strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img id="loginLogo" src="" alt="Logotipo" class="login-logo" style="display: none;">
            <h1 id="loginTitle">Sistema de Gestão</h1>
            <p>Faça login para continuar</p>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="nomeUsuario">Usuário</label>
                <input type="text" id="nomeUsuario" name="nomeUsuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <div id="setupInfo" class="setup-info" style="display: none;">
            <strong>🔧 Primeiro Acesso:</strong>
            O sistema criará automaticamente um usuário administrador com todas as permissões.
            <br><br>
            <strong>Usuário:</strong> admin<br>
            <strong>Senha:</strong> admin123
        </div>
    </div>

    <script src="/public/js/login.js"></script>
</body>
</html>
